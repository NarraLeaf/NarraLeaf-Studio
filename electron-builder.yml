appId: com.narraleaf.studio
productName: NarraLeaf Studio
directories:
  output: build
files:
  - dist/**/*
  - package.json
  - '!**/*.map'
  - '!**/{CHANGELOG,README,README.md,docs,CHANGELOG.md}/**'
  # Everything below trims the runtime dependency closure that `asarUnpack` below
  # copies out wholesale. They must live *here* rather than in the per-platform
  # blocks: a `files` key under `win:`/`mac:`/`linux:` makes these global patterns
  # disappear from the app matcher entirely (verified twice against 26.9.0 — the
  # matcher ends up holding only the platform patterns, all of which start with
  # `!`, so electron-builder decides it "contains only ignores" and prepends
  # `**/*`; the packaged asar then gains the whole repo, docs/ and src/ included,
  # while nothing fails). The node_modules copier unions the two correctly, which
  # is what makes the breakage silent: the trimming works and the asar is wrong.
  # `${os}` (win|mac|linux) and `${arch}` are expanded per target, so one global
  # list still says something different on each platform.
  #
  # Monaco is bundled, never require()d from disk: the text editor imports
  # `monaco-editor/esm/**` and esbuild inlines it (with its CSS and codicon font)
  # into dist/windows, and @monaco-editor/react is handed that instance via
  # `loader.config({ monaco })` so its own AMD/CDN loader never runs. The 68 MB on
  # disk — dev/ + esm/ + min/ side by side — is a second copy nobody reads.
  # @monaco-editor/react itself stays.
  - '!node_modules/monaco-editor{,/**/*}'
  # app-builder-bin (207 MB) and 7zip-bin (12 MB) each ship one build per platform
  # and arch they could ever run on, and each picks exactly one from
  # process.platform + process.arch (see their index.js). They are in the closure
  # because electron-builder is a runtime dependency for the in-app game build; an
  # installer is only ever one host, so the rest never executes. The `/*` is
  # load-bearing: both keep loose files (index.js, LICENSE, package.json) beside
  # their platform dirs, and a bare `!(${os})` matches those too. It leaves the
  # foreign platform dirs behind as empty shells, which is the cheaper mistake.
  - '!node_modules/app-builder-bin/!(${os})/*{,/**/*}'
  - '!node_modules/7zip-bin/!(${os})/*{,/**/*}'
  # Arch-level pruning, Windows only. `win/<arch>/` matches `${arch}` exactly
  # (x64|arm64|ia32), so this follows whatever is being packaged instead of
  # pinning x64; on mac and linux the whole win/ tree is already gone, so it is a
  # no-op there. Deliberately not generalised: mac names its two binaries
  # app-builder_amd64/_arm64 (and `--mac --universal` expands ${arch} to
  # "universal"), linux says `arm` where electron-builder says `armv7l` — both
  # would empty the keep-set silently, and only the in-app game build would
  # notice, long after packaging succeeded.
  - '!node_modules/app-builder-bin/win/!(${arch}){,/**/*}'
  # koffi (the FFI @lore-vcs/sdk loads through) ships 18 prebuilds and loads one
  # by `${process.platform}_${arch}`. The keep-list is the set of hosts Studio is
  # actually built for (see .github/workflows/release.yml) plus musl for glibc-less
  # Linux; an explicit list rather than a macro because koffi's triplets agree with
  # neither ${os} (win32, not win) nor ${arch} (armhf, riscv64d).
  - '!node_modules/koffi/build/koffi/!(win32_x64|darwin_arm64|linux_x64|musl_x64){,/**/*}'
  - from: src/renderer/public
    to: public
    filter:
      - '**/*'
extraMetadata:
  main: dist/main/index.js

asar: true
# The in-app game build worker runs electron-builder with Electron's asar fs
# patch disabled (see src/main/buildWorker/enableNoAsar.ts), so electron-builder
# and its dependency closure must be require-able as real files rather than from
# inside the asar. Unpack node_modules wholesale: enumerating the ~250-package
# closure is unmaintainable, and Studio's own main-process requires resolve from
# app.asar.unpacked transparently.
asarUnpack:
  - node_modules/**/*
# Application hardening for the shipped Studio binary. runAsNode:false is the
# load-bearing one: it closes the ELECTRON_RUN_AS_NODE path that would let the
# binary be re-run as a plain Node process. Preview spawns a *separate* Electron
# binary and the game-build worker uses utilityProcess (neither needs
# ELECTRON_RUN_AS_NODE), so this does not affect them.
#   - enableCookieEncryption stays off: Studio ships unsigned, and turning it on
#     makes the first launch prompt for keychain/secret-store access.
#   - asar integrity stays off until Studio is code-signed: on an unsigned build
#     it is a fragility footgun with no real tamper-proofing (see the game build
#     pipeline for the same reasoning).
#   - grantFileProtocolExtraPrivileges is intentionally NOT disabled: Studio
#     loads its windows over file:// (loadFile), which relies on those privileges.
electronFuses:
  runAsNode: false
  enableCookieEncryption: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: false
  onlyLoadAppFromAsar: true
  resetAdHocDarwinSignature: true
publish: null
extraResources:
  - from: ./resources
    to: resources
    filter:
      - '**/*'
      # The vendored code-signing tools are excluded here and added back per
      # platform below. project/build/prepare-codesign-tools.js stages one
      # native binary per host under resources/codesign/<platform>/, and an
      # installer must carry only the one that can actually run on it —
      # copying the whole tree would put a Mach-O binary inside the Windows
      # installer. Platform-specific extraResources are appended to these, not
      # substituted for them (app-builder-lib/out/fileMatcher.js:getFileMatchers),
      # so the two blocks compose.
      - '!codesign{,/**/*}'
      # The vendored FFmpeg tools are excluded for exactly the reason the
      # code-signing ones are, and more urgently: project/build/prepare-ffmpeg.js
      # stages ~217 MB of native binaries per host under resources/ffmpeg/<platform>/,
      # so copying the whole tree would both put a Mach-O binary inside the Windows
      # installer and multiply that size by the number of platforms staged.
      - '!ffmpeg{,/**/*}'
mac:
  target: dmg
  icon: resources/app-icon.icns
  # Studio is never code-signed, on any host. Left unset, `identity` makes
  # electron-builder search the login keychain and sign with whatever Apple
  # certificate it finds there — on a maintainer's own Mac that is their
  # personal "Apple Development" identity, which is neither a distribution
  # certificate nor a choice anyone made for this build. It also fails: the
  # embedded preview runner is a second Electron.app under Resources, and
  # codesign rejects its framework ("unsealed contents present in the root
  # directory of an embedded framework") because it was never laid out to be
  # re-signed as a nested bundle.
  #
  # CSC_IDENTITY_AUTO_DISCOVERY=false in .github/workflows/release.yml said this
  # for CI only, where no identity exists anyway. Here it holds for everyone,
  # including a plain `yarn pack-electron --mac` on a machine that does have
  # certificates.
  #
  # `notarize: false` is the other half of the pair. Notarization is configured
  # entirely through environment variables, so a maintainer with APPLE_ID
  # exported for their own tooling would otherwise have every build reach
  # Apple's service uninvited. Unreachable while `identity` is null — signing
  # returns before it — but stating one without the other invites the next
  # person to change one without the other. src/main/buildWorker/desktopSigning.ts
  # carries the same pair, for the games Studio builds.
  #
  # The ad-hoc signature an arm64 binary needs in order to launch at all is a
  # different thing and stays: electronFuses.resetAdHocDarwinSignature above
  # re-applies it after the fuses are flipped, with no identity involved.
  identity: null
  notarize: false
  # macOS means Apple Silicon here. Studio is not shipped for Intel Macs at all
  # (see .github/workflows/release.yml for the decision), so `--mac --x64` is not
  # a target anyone packages, and both mappings below are arm64-only as a
  # consequence rather than as a gap waiting to be filled.
  #
  # This is the *host* platform. Games built with Studio still target Intel Macs;
  # GAME_BUILD_ARCHS_BY_PLATFORM in src/shared/types/gameBuild.ts is the list that
  # governs that, and it is a different question from this file.
  #
  # On a mac with no Xcode Command Line Tools nothing is staged and these mappings
  # copy nothing (electron-builder logs "file source doesn't exist" and carries
  # on); the resulting Studio reports iOS signing and media conversion as
  # unavailable rather than failing to build.
  #
  # Note the macOS FFmpeg is LGPL v2.1 where the Windows and Linux ones are v3 —
  # the licence text staged next to each binary and the licenseId in its
  # manifest.json differ accordingly.
  extraResources:
    - from: ./resources/codesign/darwin
      to: resources/codesign/darwin
    - from: ./resources/ffmpeg/darwin
      to: resources/ffmpeg/darwin
win:
  target: nsis
  icon: resources/app-icon.ico
  extraResources:
    - from: ./resources/codesign/win32
      to: resources/codesign/win32
    - from: ./resources/ffmpeg/win32
      to: resources/ffmpeg/win32
linux:
  target: AppImage
  icon: resources/app-icon.png
  extraResources:
    - from: ./resources/codesign/linux
      to: resources/codesign/linux
    - from: ./resources/ffmpeg/linux
      to: resources/ffmpeg/linux
