nodeLinker: node-modules
enableScripts: true

# @narraleaf/encryption is published to GitHub Packages rather than the public
# registry, so installing it needs a token with read:packages. Only the address
# lives here - the credential belongs in ~/.yarnrc.yml under npmRegistries, so
# that no checkout ever carries one. An install that fails on 401 for this scope
# means that file is missing, not that the dependency is.
npmScopes:
  narraleaf:
    npmRegistryServer: "https://npm.pkg.github.com"
