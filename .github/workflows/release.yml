name: Release

# Cuts a downloadable, versioned GitHub Release from a version tag. Push a tag
# like v0.1.1 and this builds the desktop installers — Windows x64 and macOS
# Apple Silicon — and attaches them to a Release named for the tag, marked as
# the latest stable.
#
# This release is also what installed copies of Studio update from: alongside the installers it
# carries `latest.yml` and the `.blockmap` files electron-updater reads (see the Upload step).
# Two consequences for whoever cuts a release: the tag must match `version` in package.json
# exactly, and the release must not be left as a draft — an installed Studio cannot see either
# one, and fails quietly rather than loudly.
#
# There is deliberately no macOS x64 installer: Studio is not shipped for Intel
# Macs. Three of its subsystems have no Intel-Mac implementation and two of them
# are not ours to fix — @lore-vcs publishes only sdk-arm64-apple-darwin (version
# control is a core feature), zsign publishes no macOS x64 asset (iOS signing),
# and our LGPL FFmpeg is compiled host-arch-only (media conversion). Shipping an
# Intel build would mean an author discovers each gap one at a time, after their
# work is already inside the tool. Rosetta only runs the other way round, so an
# arm64 installer is not a substitute either.
#
# This is about where *Studio* runs. Games built with Studio still target Intel
# Macs — see GAME_BUILD_ARCHS_BY_PLATFORM in src/shared/types/gameBuild.ts.
#
# Once published, the release's files are copied to GitCode (the `gitcode` job below), which is
# where mainland China downloads Studio from. A failed copy leaves the GitHub release as it is; run
# "Mirror to GitCode" by hand for the tag once whatever stopped it is fixed.
#
# Nothing here is code-signed, so every installer is unsigned and the OS will
# quarantine it on first launch — the same caveat as the nightly builds.
#
# workflow_dispatch is offered for a dry run: dispatched from a branch there is
# no tag, so the `release` job is skipped and only the installers are produced
# as run artifacts. A real Release is published only for a pushed v* tag.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# The publish job creates the Release and uploads assets; the token needs write.
# `packages: read` is for the install step instead: the @narraleaf scope comes
# from GitHub Packages, which asks for a credential on every package it holds.
permissions:
  contents: write
  packages: read

# One tag, one release run. Do not cancel a publish midway.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      # One broken target must not hide the results of the other.
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            args: --win --x64
            electron_arch: x64
          - name: macos-arm64
            os: macos-latest
            args: --mac --arm64
            electron_arch: arm64

    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      # npm_config_arch pins the Electron runtime to the *target's* architecture
      # rather than the runner's: prepare-preview-runner.js stages
      # node_modules/electron/dist into resources/, and that copy becomes the
      # Electron runtime the packaged Studio ships. Electron's installer honours
      # npm_config_arch, so a job whose runner arch differs from its target arch
      # would otherwise embed a runtime that cannot execute where the installer
      # lands. Every row above happens to be self-matched today (the macOS x64
      # target, which was the one that genuinely cross-built, is gone), so this is
      # now defence against a runner image moving or a row being added — keep it.
      # --no-immutable because this repo deliberately does not commit yarn.lock,
      # so every CI run legitimately writes one.
      # See the same step in .github/actions/install for why this is the run's own
      # GITHUB_TOKEN and not a stored personal token.
      - name: Authenticate to GitHub Packages
        run: node .github/scripts/write-packages-credential.mjs
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: yarn install --no-immutable
        env:
          npm_config_arch: ${{ matrix.electron_arch }}

      # --publish never: the separate `release` job attaches the installers, so
      # electron-builder must not try to reach a release itself.
      # CSC_IDENTITY_AUTO_DISCOVERY=false stops it hunting for a signing identity
      # the runner does not have.
      #
      # NLS_REQUIRE_FFMPEG turns prepare-ffmpeg.js's skips into failures. Every
      # one of them is the right answer on a developer's machine and the wrong
      # one here: an installer staged without FFmpeg reports media conversion as
      # unavailable to everyone who downloads it, and says so only in a warning
      # line in a green log. It matters most on macOS, where the binary is
      # compiled from source on the runner rather than downloaded.
      - name: Package
        run: yarn pack-electron ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          NLS_REQUIRE_FFMPEG: "1"

      # The other half of the gate above. Staging into resources/ and getting
      # into the installer are two different steps, and the second one —
      # electron-builder's extraResources — is the one that copies nothing and
      # carries on. The script reads the installer that is about to be attached
      # to the release; see its header for why each platform is checked the way
      # it is.
      - name: Verify FFmpeg shipped inside the package
        shell: bash
        run: bash project/build/verify-packaged-ffmpeg.sh

      # Only the installers and the update metadata — the unpacked app directories in build/ are
      # hundreds of megabytes of intermediate output. if-no-files-found: error because a
      # packaging step that silently produces nothing must not read as a pass.
      #
      # The latest*.yml and *.blockmap lines are the auto-updater's half of a release. `latest.yml`
      # (`latest-mac.yml` on macOS) is the feed an installed Studio polls, and the blockmap is what
      # turns a 270 MB update into a delta. Dropping them does not fail anything here or look wrong
      # on the release page — it just means every installed copy checks for updates against a 404,
      # forever, and says so only in its log. This is the one step in the chain with no visible
      # failure.
      #
      # `latest*.yml` and not `*.yml`: build/ also holds electron-builder's own `builder-debug.yml`,
      # which is a debug dump rather than update metadata, and every platform writes one under that
      # same name. A release asset name must be unique, so collecting them turns the publish step
      # below into a 422 on the second platform — which is how v0.5.0 first failed to publish. The
      # feed files are the only .yml a release wants, and they are already platform-distinct.
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: narraleaf-studio-${{ matrix.name }}
          path: |
            build/*.exe
            build/*.dmg
            build/*.zip
            build/latest*.yml
            build/*.blockmap
          if-no-files-found: error

  # Collect every platform's installers and publish them as one Release for the
  # tag. Skipped on workflow_dispatch (there is no tag to release).
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      # gh is preinstalled on the runner, so no third-party action is pulled in to
      # touch the release. Re-running against an existing tag refreshes its assets
      # in place rather than failing.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find dist-artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name 'latest*.yml' -o -name '*.blockmap' \) | sort)
          test "${#files[@]}" -gt 0 || { echo "::error::no installers found to attach"; exit 1; }
          printf 'attaching:\n'; printf '  %s\n' "${files[@]}"
          # A release asset is identified by its basename, so two platforms contributing the same
          # filename cannot both be attached. Caught here it names the file; left to the API it
          # arrives as a 422 partway through uploading, after the release object already exists.
          # Every installer name here contains spaces, so basename must be called per element
          # rather than through xargs, which would split on them.
          dupes=$(for f in "${files[@]}"; do basename "$f"; done | sort | uniq -d)
          test -z "$dupes" || { echo "::error::two platforms produced the same asset name: $(printf '%s' "$dupes" | tr '\n' ' ')"; exit 1; }
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --repo "$REPO" --clobber
          else
            gh release create "$TAG" "${files[@]}" \
              --repo "$REPO" \
              --title "$TAG" \
              --generate-notes \
              --verify-tag
          fi

  # Copy the release to GitCode. After `release` so the copy is of what GitHub actually serves, and
  # beside `plugin-types` rather than before it: GitCode being slow or down must not hold anything
  # else back. See mirror-gitcode.yml.
  gitcode:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/mirror-gitcode.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit

  # Publish the plugin API's types package, `narraleaf-studio`, under the same version as the
  # Studio just released. The two versions are the same number on purpose: a plugin author reads
  # off which Studio a declaration describes, and a plugin's devDependency range says which Studio
  # it was written against. Publishing it here, from the tag, is what keeps that true - a manual
  # step once left a bumped version unpublished for weeks.
  #
  # There is no npm token anywhere in this repository. The job authenticates with npm trusted
  # publishing: the registry is configured to accept this workflow file in this repository, and
  # `id-token: write` lets npm exchange the run's OIDC identity for a publish credential that lasts
  # only as long as the publish. The same exchange attaches a provenance statement to the package.
  # Renaming this file breaks that trust, which is set on the package's settings page on npmjs.com.
  #
  # It runs after `release` rather than beside the builds so the declarations never reach npm for a
  # Studio nobody can download yet. Re-running it after a success is harmless: a version already on
  # the registry is skipped, since npm refuses a second publish of the same version anyway.
  plugin-types:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Enable Corepack
        run: corepack enable

      # The declarations are generated from Studio's source by the package's prepack script, which
      # needs the repository's own dependencies - the same install the builds above do.
      - name: Authenticate to GitHub Packages
        run: node .github/scripts/write-packages-credential.mjs
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: yarn install --no-immutable

      # The tag, Studio's version and the types package's version must be one number. A unit test
      # holds the manifests together; this holds them to the tag, which no test can see.
      - name: Check the versions agree
        id: version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          studio=$(node -p "require('./package.json').version")
          types=$(node -p "require('./packages/plugin-types/package.json').version")
          test "$TAG" = "v$studio" || { echo "::error::tag $TAG does not match Studio's version $studio"; exit 1; }
          test "$types" = "$studio" || { echo "::error::packages/plugin-types is $types but Studio is $studio"; exit 1; }
          echo "version=$types" >> "$GITHUB_OUTPUT"

      - name: Skip a version already on npm
        id: published
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/narraleaf-studio/$VERSION")
          case "$status" in
            200) echo "narraleaf-studio@$VERSION is already published; nothing to do."; echo "done=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "done=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::the registry answered $status for narraleaf-studio@$VERSION"; exit 1 ;;
          esac

      # Trusted publishing needs npm 11.5.1 or later; Node 22 bundles npm 10.
      - name: Publish narraleaf-studio
        if: steps.published.outputs.done == 'false'
        working-directory: packages/plugin-types
        run: |
          npm install --global npm@^11.5.1
          npm publish
