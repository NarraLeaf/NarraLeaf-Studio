name: Nightly

# Builds distributable Studio installers from the nightly branch: Windows x64
# and macOS Apple Silicon, and publishes them as the rolling `nightly`
# prerelease. Nothing here is code-signed, so every build is an unsigned nightly
# that the OS will quarantine on first launch.
#
# This file lives only on the nightly branch, which is what makes it the one
# workflow a merge from develop cannot carry and a force-push to nightly
# silently drops. Propagate to nightly by merging, never by resetting the
# branch: without this file a push to nightly runs ci.yml's verify and builds
# nothing, and the Releases page keeps serving whichever nightly came last.
#
# There is no macOS x64 nightly. Studio is not shipped for Intel Macs at all;
# release.yml's header carries the reasoning, and this matrix must stay in step
# with it. It outlived the removal there by one release, which is how nightly
# went on offering an Intel installer of a Studio that has no Intel build.
#
# Correctness is deliberately not re-checked here: ci.yml's `verify` job already
# runs on every push to nightly, so duplicating the typecheck and test suite
# would only add minutes to the packaging turnaround.
#
# On the triggers, and the GitHub behaviour behind each:
#   push             — the trigger that actually fires today. Push events run
#                      the workflow from the pushed ref, so this file works
#                      while it lives only on the nightly branch.
#   workflow_dispatch — declared for later. GitHub only offers manual runs for
#                      workflows that exist on the DEFAULT branch, so this stays
#                      inert until nightly.yml is merged to master.
#   schedule          — deliberately absent. Scheduled runs fire only from the
#                      default branch too, so a cron added here would read as
#                      correct and then silently never run. Add it in the same
#                      change that lands this file on master, not before.

on:
  push:
    branches: [nightly]
  workflow_dispatch:

# Two packaging jobs, one of them on a macOS runner that bills at ten times the
# Linux rate. A rapid series of pushes should not leave several full matrices
# racing each other for a result only the newest push cares about.
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

# The package jobs publish nothing, so the default token stays read-only; the
# release job below overrides this to contents: write to move the rolling tag.
# `packages: read` is for the install step: the @narraleaf scope is served by
# GitHub Packages, which asks for a credential on every package it holds.
permissions:
  contents: read
  packages: read

jobs:
  package:
    strategy:
      # One broken target must not hide the results of the other.
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            args: --win --x64
            electron_arch: x64
          - name: macos-arm64
            os: macos-latest
            args: --mac --arm64
            electron_arch: arm64

    name: package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      # See the same step in ci.yml for why this is the run's own GITHUB_TOKEN
      # and not a stored personal token. Without it the install resolves
      # @narraleaf/bindings as an anonymous user and dies in the resolution
      # step, which is how the first 0.9.0 merge to this branch failed.
      - name: Authenticate to GitHub Packages
        run: node .github/scripts/write-packages-credential.mjs
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # npm_config_arch pins the Electron runtime to the target's architecture
      # rather than the runner's. prepare-preview-runner.js stages
      # node_modules/electron/dist into resources/, and that copy becomes the
      # Electron runtime the packaged Studio uses for Preview and for building
      # games. Electron's installer honours npm_config_arch, so a job whose
      # runner arch differs from its target arch would embed a runtime that
      # cannot execute where the installer lands. Both rows above are now
      # self-matched (macos-x64, the one that genuinely cross-built, is gone), so
      # this is defence against a runner image moving or a row being added.
      #
      # It affects nothing else: electron-builder downloads its own Electron for
      # the target named by --x64/--arm64, and @narraleaf/bindings ships every
      # platform's prebuild in the package and picks one at runtime.
      #
      # --no-immutable is required, not a shortcut: yarn defaults to --immutable
      # under CI, and this repo deliberately does not commit yarn.lock, so every
      # run legitimately writes one.
      - name: Install dependencies
        run: yarn install --no-immutable
        env:
          npm_config_arch: ${{ matrix.electron_arch }}

      # --publish never: electron-builder.yml sets `publish: null` and this
      # pipeline uploads artifacts itself, so the packager must not try to reach
      # a release. CSC_IDENTITY_AUTO_DISCOVERY=false keeps it from hunting for a
      # signing identity the runner does not have.
      - name: Package
        run: yarn pack-electron ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # Only the installers. The unpacked app directories electron-builder
      # leaves in build/ are hundreds of megabytes of intermediate output, and
      # the .blockmap files next to each installer only serve a differential
      # updater this project does not run.
      #
      # if-no-files-found: error because a packaging step that silently produces
      # nothing is indistinguishable from a green build.
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: narraleaf-studio-nightly-${{ matrix.name }}
          path: |
            build/*.exe
            build/*.dmg
            build/*.zip
          if-no-files-found: error
          # Nightlies are superseded by the next push; the 90-day default would
          # accumulate tens of gigabytes for builds nobody returns to.
          retention-days: 14

  # Publish the freshly built installers as one rolling prerelease, so the latest
  # nightly is always downloadable from the Releases page. The `nightly` tag is
  # moved to each new build — there is only ever one nightly release, and its
  # assets never pile up stale platforms.
  release:
    needs: package
    runs-on: ubuntu-latest
    # Overrides the workflow-level contents: read — this job moves the tag and
    # uploads assets.
    permissions:
      contents: write
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      # gh is preinstalled on the runner. Delete-then-recreate moves the rolling
      # `nightly` tag to this commit and replaces the assets in one shot, so the
      # release never points at a stale build or accumulates old installers.
      - name: Publish rolling nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find dist-artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \) | sort)
          test "${#files[@]}" -gt 0 || { echo "::error::no installers found to attach"; exit 1; }
          printf 'attaching:\n'; printf '  %s\n' "${files[@]}"
          if gh release view nightly --repo "$REPO" >/dev/null 2>&1; then
            gh release delete nightly --repo "$REPO" --yes --cleanup-tag
          fi
          gh release create nightly "${files[@]}" \
            --repo "$REPO" \
            --title "Nightly (latest)" \
            --notes "Rolling nightly build from \`${SHA}\`. Unsigned — your OS will quarantine it on first launch." \
            --prerelease \
            --target "$SHA"
